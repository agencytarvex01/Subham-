<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>SYSTEM ARMY #1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#030711;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* Background glow */
body::before{
    content:"";
    position:fixed;
    width:430px;
    height:430px;
    left:50%;
    top:90px;
    transform:translateX(-50%);
    background:rgba(0,255,190,.13);
    filter:blur(100px);
    border-radius:50%;
    pointer-events:none;
}

/* Main mobile frame */
.page{
    width:100%;
    max-width:480px;
    min-height:100svh;
    margin:auto;
    padding:42px 24px 35px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
}

/* DP */
.profile-wrap{
    width:200px;
    height:200px;
    padding:7px;
    border-radius:50%;
    background:linear-gradient(135deg,#00d9ff,#00f0b0,#00bfff);
    box-shadow:
        0 0 18px rgba(0,230,255,.75),
        0 0 45px rgba(0,255,190,.25);

    animation:floatPhoto 4.5s ease-in-out infinite;
}

.profile-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:50%;
    border:3px solid #071019;
}

/* Slow up-down movement */
@keyframes floatPhoto{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-9px);
    }
}

/* Heading */
h1{
    margin-top:54px;
    font-size:40px;
    line-height:1.05;
    font-weight:800;
    letter-spacing:1px;
    white-space:nowrap;
    text-shadow:
        0 0 10px rgba(0,255,210,.65),
        0 0 25px rgba(0,220,255,.28);
}

/* Description */
.description{
    margin-top:38px;
    max-width:420px;
    font-size:21px;
    line-height:1.5;
    color:#c7d0df;
    font-weight:400;
}

/* Button */
.telegram-btn{
    width:100%;
    max-width:420px;
    height:78px;
    margin-top:58px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;

    border-radius:45px;
    text-decoration:none;
    color:#fff;

    background:linear-gradient(
        100deg,
        #069bd7,
        #08c5f3
    );

    box-shadow:
        0 8px 25px rgba(0,185,255,.28),
        0 0 20px rgba(0,205,255,.28);

    transition:transform .2s ease;
    
    animation:buttonPulse 3s ease-in-out infinite;
}

.telegram-btn:active{
    transform:scale(.97);
}

/* Professional subtle size + glow pulse */
@keyframes buttonPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 8px 25px rgba(0,185,255,.28),
            0 0 20px rgba(0,205,255,.28);
    }

    50%{
        transform:scale(1.025);
        box-shadow:
            0 10px 30px rgba(0,200,255,.38),
            0 0 32px rgba(0,220,255,.38);
    }
}

/* Telegram icon */
.telegram-icon{
    width:34px;
    height:34px;
    flex-shrink:0;
    fill:white;
}

.button-text{
    font-size:27px;
    font-weight:800;
    letter-spacing:.3px;
}

/* Bottom text */
.bottom-text{
    margin-top:45px;
    color:#727d8e;
    font-size:19px;
    line-height:1.4;
}

/* Smaller phones */
@media(max-width:390px){

    .page{
        padding:32px 18px 28px;
    }

    .profile-wrap{
        width:175px;
        height:175px;
    }

    h1{
        margin-top:45px;
        font-size:31px;
    }

    .description{
        margin-top:31px;
        font-size:17px;
    }

    .telegram-btn{
        height:68px;
        margin-top:46px;
    }

    .button-text{
        font-size:22px;
    }

    .telegram-icon{
        width:29px;
        height:29px;
    }

    .bottom-text{
        margin-top:36px;
        font-size:16px;
    }
}

/* Accessibility */
@media(prefers-reduced-motion:reduce){
    .profile-wrap,
    .telegram-btn{
        animation:none;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- DP -->
    <div class="profile-wrap">
        <img
            src="https://iili.io/noXf6n1.md.jpg"
            alt="System Army profile">
    </div>

    <!-- Heading -->
    <h1>SYSTEM ARMY #1</h1>

    <!-- Description -->
    <div class="description">
        Official Telegram Channel में जुड़ने के लिए नीचे दिए गए बटन पर तुरंत क्लिक करें!
    </div>

    <!-- Telegram Button -->
    <a
        class="telegram-btn"
        href="https://t.me/+yFdVCqnw6Co2YWFl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Subscribe Now">

        <!-- Telegram SVG -->
        <svg class="telegram-icon"
             viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
            <path d="M21.8 3.2 18.7 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6.1 13.7 1.2 12.2c-1.1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.7.2 1.3.2z"/>
        </svg>

        <span class="button-text">SUBSCRIBE NOW</span>
    </a>

    <!-- Bottom -->
    <div class="bottom-text">
        100% Free &amp; Verified Community
    </div>

</div>

</body>
</html>
